apiVersion: apps/v1
kind: Deployment
metadata:
  name: arc56-registry
  namespace: algo-safe
spec:
  replicas: 2
  selector:
    matchLabels:
      app: arc56-registry
  template:
    metadata:
      labels:
        app: arc56-registry
    spec:
      containers:
        - name: arc56-registry
          image: scholtz2/arc56-registry:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          # nginx `worker_processes auto` spawns one worker per host CPU
          # (~90 on our nodes); the old 64Mi limit got the pod OOMKilled
          # right after "start worker processes". Matches biatec-scan-web.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
